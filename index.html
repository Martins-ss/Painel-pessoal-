<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f5f3ee;--card:#fffdf9;--tx:#1b2430;--mut:#6a6f7a;--bd:#e2ddd2;--ac:#1e3a5f;--ac2:#1e3a5f;--rd:#9b2c2c;--gn:#2f6b4f;--sh:0 1px 2px rgba(27,36,48,.07)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1a202a;--tx:#e8e6e1;--mut:#9aa1ad;--bd:#2a3240;--ac:#5a86bd;--ac2:#5a86bd;--rd:#e08a8a;--gn:#6fcf9a;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1a202a;--tx:#e8e6e1;--mut:#9aa1ad;--bd:#2a3240;--ac:#5a86bd;--ac2:#5a86bd;--rd:#e08a8a;--gn:#6fcf9a;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:2px 0 2px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 2px 8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
.brand{cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:11px;padding:12px 16px 4px;max-width:560px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.bt{display:flex;flex-direction:column;line-height:1.25;min-width:0}.bt b{font-size:15px;font-weight:700}.bt span{font-size:12px;color:var(--mut)}.bt span::first-letter{text-transform:uppercase}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 10px;max-width:560px;margin:0 auto}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;position:relative;border:0;background:none;color:var(--mut);padding:11px 12px 10px;font:600 14px 'Inter',system-ui,sans-serif;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s}
nav button.on{color:var(--ac);border-bottom-color:var(--ac)}
.hm{position:relative}.hm>:first-child{padding-right:30px}.mn{position:absolute;top:6px;right:8px;width:28px;height:28px;border:0;background:none;color:var(--mut);font:700 22px/1 'Inter',system-ui,sans-serif;border-radius:8px;padding:0;cursor:pointer}.cs>:not(:first-child):not(.mn){display:none}.sec{margin:10px 0;display:grid;gap:9px}
.chip.sure{background:var(--rd);color:#fff;border-color:var(--rd)}#nav2{border-top:1px solid var(--bd)}#nav2[hidden]{display:none}#nav2 button{font-size:13px;font-weight:600}.ar{display:grid;gap:8px}.ar .row{align-items:end}.ar .ic{width:64px!important;text-align:center}
.dot{position:absolute;top:8px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--rd)}
@media (min-width:900px){body{padding-left:260px}.top{position:fixed;left:0;top:0;bottom:0;width:260px;border-right:1px solid var(--bd);border-bottom:0;box-shadow:none;overflow-y:auto}.brand{padding:22px 20px 14px}nav{flex-direction:column;overflow:visible;padding:4px 12px;gap:2px}nav button{text-align:left;border-bottom:0;border-radius:9px;padding:11px 14px}nav button.on{background:rgba(37,99,235,.1)}main{max-width:760px;padding:32px 32px 60px}}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.hc{text-align:left;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);color:inherit;border-radius:14px;padding:13px;font:inherit;cursor:pointer;display:block;width:100%}.hc .m{margin:0}.hc .big{margin:4px 0 2px}.hc:active{transform:scale(.98)}.hi{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}.hi:last-child{border-bottom:0}
.warn{border-color:var(--rd)!important;background:rgba(229,72,77,.08)!important}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;font-size:13.5px;font-weight:600;transition:background .15s,color .15s}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.form,.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:grid;gap:9px;margin:10px 0;box-shadow:var(--sh)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:15px 'Inter',system-ui,sans-serif;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.add{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:11px;padding:12px;font:700 15.5px 'Inter',sans-serif;letter-spacing:.01em}
.t{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:11px;margin-bottom:7px;box-shadow:var(--sh);transition:opacity .15s}
.t input{width:21px;height:21px;flex:none;accent-color:var(--ac)}
.t .b{flex:1;min-width:0}.t .n{overflow-wrap:anywhere;font-weight:600}
.t.done{opacity:.55}.t.done .n{text-decoration:line-through;color:var(--mut);font-weight:400}
.m{font-size:12.5px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);margin-right:6px}
.late,.neg{color:var(--rd)}.pos{color:var(--gn)}
.x{background:none;border:0;color:var(--mut);font-size:22px;padding:0 2px}
.big{font-size:29px;font-weight:800}
.cf{display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 2px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);font-weight:800;font-size:15px}
.md{font-size:21px;font-weight:800;line-height:1.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11.5px;color:var(--mut);font-weight:700}
.cal button{touch-action:manipulation;position:relative;aspect-ratio:1;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:13.5px;font-weight:600;padding:0;transition:transform .1s}
.cal button.off{background:var(--bg);color:var(--mut);font-weight:400}
.cal button.hol{color:var(--rd)}
.cal button.td{border-color:var(--ac);border-width:2px;font-weight:800}
.cal button.sel{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.cal i.jj{background:var(--gn)!important}
.cal i{position:absolute;right:2px;top:1px;font-size:9.5px;font-style:normal;font-weight:700;background:var(--rd);color:#fff;border-radius:8px;padding:0 4px;line-height:1.4}
.mh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}
.mh button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 14px;font-size:16px}
.lb{display:flex;gap:10px;align-items:center}.lb input{width:22px;height:22px}
.empty{color:var(--mut);text-align:center;padding:28px 10px;font-size:14px;line-height:2}
.empty .ic{font-size:32px}
.seg{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px}
.seg button{border:1px solid var(--bd);background:var(--bg);color:var(--mut);border-radius:9px;padding:7px 4px;font:600 12.5px 'Inter',sans-serif}
.seg button.p.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
.seg button.c.on{background:var(--gn);color:#fff;border-color:var(--gn)}
.seg button.d{color:var(--rd);font-size:14px;padding:0 14px}.seg button.d.sure{background:var(--rd);color:#fff;border-color:var(--rd)}
.asg{border:1px solid var(--bd);border-radius:10px;padding:9px 10px;display:grid;gap:7px;background:var(--card)}.asg b{font-size:14px}
#smsg{color:var(--rd);font-size:13px}
.dd{border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.dd summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mut)}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"▾";font-size:18px;color:var(--tx);transition:transform .15s}
.dd[open] summary::after{transform:rotate(180deg)}
.dd .opts{max-height:220px;overflow-y:auto;border-top:1px solid var(--bd);padding:4px 6px}
.dd label{display:flex;align-items:center;gap:10px;padding:9px 6px;font-size:15px}
.dd label input{width:20px;height:20px;flex:none;accent-color:var(--ac)}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:11px;margin-bottom:7px;box-shadow:var(--sh)}
.sc.done{opacity:.6}.sc.done .n{text-decoration:line-through;color:var(--mut);font-weight:400}
.sc .n{font-weight:600;overflow-wrap:anywhere}
#intro{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(160deg,#ff8a3d 0%,#f7508f 35%,#8b5cf6 70%,#3b82f6 100%);color:#fff;text-align:center;overflow:hidden;cursor:pointer;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);transition:opacity .5s,visibility .5s}
#intro.out{opacity:0;visibility:hidden}
#intro .fl{position:absolute;top:-12vh;line-height:1;pointer-events:none;animation:fall linear infinite}
#intro .tt{font-size:30px;line-height:1.2;padding:0 12px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.25);z-index:1;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
#intro .st{font-size:15px;opacity:.92;z-index:1;animation:pop .8s .3s both}
#intro .go{margin-top:16px;padding:12px 30px;border-radius:24px;background:#fff;color:#5b5bf0;font-weight:800;z-index:1;animation:pop .8s .6s both,pulse 1.6s 1.4s infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(22px,31vh) rotate(90deg)}50%{transform:translate(-22px,62vh) rotate(180deg)}75%{transform:translate(22px,94vh) rotate(270deg)}100%{transform:translate(0,125vh) rotate(360deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.7)}50%{transform:scale(1.12);box-shadow:0 0 0 14px rgba(255,255,255,0)}}

/* ===== Visual profissional / acadêmico ===== */
h1,.bt b,#intro .tt{font-family:'Source Serif 4',Georgia,'Times New Roman',serif}
h1{font-size:25px;font-weight:600;letter-spacing:-.005em;padding-bottom:9px;margin:2px 0 14px;border-bottom:1px solid var(--bd)}
h2{font-size:11.5px;letter-spacing:.09em;color:var(--ac);margin:22px 2px 8px}
.bt b{font-size:16px;font-weight:600}
.logo{background:var(--ac);border-radius:8px;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:14px}
.top{box-shadow:none}
nav button{font-weight:500}nav button.on{font-weight:600}
@media (min-width:900px){nav button.on{background:rgba(30,58,95,.09)}}
@media (min-width:900px) and (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{background:rgba(90,134,189,.16)}}
.form,.box,.hc,.t,.sc{border-radius:10px}
.hc,.t,.sc,.form,.box{box-shadow:var(--sh)}
input,select{border-radius:8px}
button.add{background:var(--ac);border-radius:8px;font-weight:600;letter-spacing:.01em}
button.add:hover{filter:brightness(1.12)}
.chip{border-radius:8px;font-weight:500}.chip.on{background:var(--ac);border-color:var(--ac)}
.tag{border-radius:6px;font-weight:500;background:transparent}
.big,.md,.cf{font-weight:700;font-variant-numeric:tabular-nums}
.cal button{border-radius:8px}
.cal button.sel{background:var(--ac)}
.seg button{border-radius:7px;font-weight:500}.seg button.p.on{background:#a8741a;border-color:#a8741a}
.warn{background:rgba(155,44,44,.06)!important}
#intro{background:linear-gradient(165deg,#1e3a5f 0%,#14263f 100%);gap:8px}
#intro .fl{display:none}
#intro .tt{font-size:32px;font-weight:600;text-shadow:none;animation:none}
#intro .st{font-size:14px;letter-spacing:.04em;opacity:.8;animation:none}
#intro .go{margin-top:22px;padding:11px 32px;border-radius:8px;background:#fffdf9;color:#1e3a5f;font-weight:600;animation:none}

#bkb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:90;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);box-shadow:var(--sh);font-size:18px;cursor:pointer;opacity:.85}
#bkm{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
#bkm.on{display:flex}
#bkm .bx{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:20px;max-width:340px;width:100%}
#bkm h3{margin:0 0 6px;font-size:17px}#bkm p{margin:0 0 14px;font-size:13px;color:var(--mut);line-height:1.4}
#bkm button{display:block;width:100%;padding:11px;margin-bottom:8px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;cursor:pointer}
#bkm button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#bkst{font-size:12px;color:var(--mut);margin-top:4px;min-height:16px}
</style>
</head>
<body>
<div id="intro" onclick="closeIntro()"><div class="tt">Painel de Gestão Pessoal</div><div class="st">Acompanhamento acadêmico e financeiro</div><div class="go">Entrar</div></div>
<header class="top"><div class="brand" role="button" tabindex="0" title="Voltar ao início" onclick="go('home')" onkeydown="if(event.key==='Enter'||event.key===' '){go('home')}"><div class="logo">PG</div><div class="bt"><b>Painel de Gestão Pessoal</b><span id="dt"></span></div></div><nav id="nav"></nav><nav id="nav2" hidden></nav></header>
<main id="app"></main>
<script>
const $=id=>document.getElementById(id),P=n=>String(n).padStart(2,"0"),K=(y,m,d)=>y+"-"+P(m+1)+"-"+P(d);
let now=new Date(),TD=K(now.getFullYear(),now.getMonth(),now.getDate()),YM=TD.slice(0,7);
const HOL={};[["2026-01-01","Confraternização Universal"],["2026-02-16","Carnaval"],["2026-02-17","Carnaval"],["2026-04-03","Sexta-feira Santa"],["2026-04-21","Tiradentes"],["2026-05-01","Dia do Trabalho"],["2026-06-04","Corpus Christi"],["2026-09-07","Independência"],["2026-10-12","N. Sra. Aparecida"],["2026-11-02","Finados"],["2026-11-15","Proclamação da República"],["2026-11-20","Consciência Negra"],["2026-12-25","Natal"],["2027-01-01","Confraternização Universal"],["2027-02-08","Carnaval"],["2027-02-09","Carnaval"],["2027-03-26","Sexta-feira Santa"],["2027-04-21","Tiradentes"],["2027-05-01","Dia do Trabalho"],["2027-05-27","Corpus Christi"],["2027-09-07","Independência"],["2027-10-12","N. Sra. Aparecida"],["2027-11-02","Finados"],["2027-11-15","Proclamação da República"],["2027-11-20","Consciência Negra"],["2027-12-25","Natal"]].forEach(([d,n])=>HOL[d]=n);
let S={pt:{cfg:{in:"08:00",out:"12:00",br:15,days:[1,2,3,4,5]},d:{},emp:"",cargo:"",start:"",act:[]},bol:{min:5,subs:[]},school:[],abs:{},just:{},off:{},pmDay:"",gen:[],pay:[],vr:{val:0,day:25,items:[]}};
try{const r=localStorage.getItem("org2");if(r)Object.assign(S,JSON.parse(r));else{const o=JSON.parse(localStorage.getItem("tasks")||"[]");S.gen=o.map(x=>({id:x.id,t:x.t,c:x.c==="Trabalho"||x.c==="Curso"?x.c:"Outros",d:x.d,done:x.done}))}}catch(e){}
if(S.bol&&S.bol.min===6&&!S.bol.subs.length)S.bol.min=5;
if(!S.pt.act)S.pt.act=[];["emp","cargo","start"].forEach(f=>{if(S.pt[f]==null)S.pt[f]=""});
const sv=()=>{try{localStorage.setItem("org2",JSON.stringify(S))}catch(e){}};
const MATS=["Aprofundamento de Filosofia","Aprofundamento de Geografia","Aprofundamento de Sociologia","Atualidades","Educação Física","Física","História","Inglês","Língua Portuguesa","Matemática","Orientação de Estudo – Língua Portuguesa","Orientação de Estudo – Matemática","Projeto de Vida","Redação e Leitura"];
if(!S.bol.seeded){const have=S.bol.subs.map(x=>x.n.toLowerCase());MATS.forEach((n,i)=>{if(!have.includes(n.toLowerCase()))S.bol.subs.push({id:Date.now()+i,n,g:[null,null,null,null]})});S.bol.seeded=1;sv()}
let tab="home",cy=now.getFullYear(),cm=now.getMonth(),sel=TD;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmt=d=>d.split("-").reverse().slice(0,2).join("/");
const diff=d=>Math.round((new Date(d+"T00:00")-new Date(TD+"T00:00"))/864e5);
const arr=l=>l==="vr"?S.vr.items:S[l];
const isDone=k=>k.rep==="m"?k.pm===YM:!!k.done;
const val=id=>$(id).value.trim();
function tg(l,id){const k=arr(l).find(x=>x.id==id);if(k.rep==="m")k.pm=k.pm===YM?"":YM;else{k.done=!k.done;if(k.done)k.doneAt=Date.now();else delete k.doneAt}sv();R()}
function rm(l,id){const a=arr(l).filter(x=>x.id!=id);if(l==="vr")S.vr.items=a;else S[l]=a;sv();R()}
function row(l,k,meta){const d=isDone(k);return `<div class="t ${d?"done":""}"><input type="checkbox" ${d?"checked":""} onchange="tg('${l}',${k.id})"><div class="b"><div class="n">${esc(k.t)}</div><div class="m">${meta}</div></div><button class="x" onclick="rm('${l}',${k.id})" aria-label="Excluir">×</button></div>`}
const dm=k=>k.d?`<span class="${!isDone(k)&&k.d<TD?"late":""}">${fmt(k.d)}</span>`:"";
const done=(l,f)=>{sv();R()};
let F={subs:{},t:"",d:"",list:[]},delC=null;
const kn=x=>x==="Trabalho"?"Apresentação":x;
const kSum=n=>{const a=F.subs[n]||[];return a.length?a.map(x=>KINDS[x]+" "+kn(x)).join(", "):"O que fazer? Toque para escolher"};
const subSum=()=>{const n=Object.keys(F.subs).length;return n?n+(n>1?" matérias selecionadas":" matéria selecionada"):"Selecionar matérias"};
function asgH(){return F.list.map((n,i)=>F.subs[n]?`<div class="asg"><b>${esc(n)}</b><details class="dd"><summary id="ks${i}">${esc(kSum(n))}</summary><div class="opts">${Object.keys(KINDS).map(c=>`<label><input type="checkbox" ${F.subs[n].includes(c)?"checked":""} onchange="togK(${i},'${c}',this.checked)"> ${KINDS[c]} ${kn(c)}</label>`).join("")}</div></details></div>`:"").join("")}

function bolCalc(g,min){
 const l=g.filter(x=>x!==null),n=l.length,sum=l.reduce((a,b)=>a+b,0),rest=4-n;
 const left=g.map((x,i)=>x===null?(i+1)+"º":null).filter(Boolean).join(", ");
 if(rest===0){const m=sum/4;return{st:m>=min?"ok":"fail",m,html:`<div class="m ${m>=min?"pos":"neg"}">${m>=min?"✅ Aprovado(a) nesta matéria":"❌ Abaixo da média de "+fn(min)+" — vai para recuperação"}</div>`}}
 const need=(min*4-sum)/rest,cur=n?`<div class="m">Média até agora: <b>${fn(sum/n)}</b> (${n} bimestre(s) lançado(s))</div>`:"";

 if(need>10)return{st:"fail",html:cur+`<div class="m neg">⚠️ Precisaria de ${fn(ce(need))} em cada bimestre que falta (${left}), acima de 10</div>`};
 return{st:"go",html:cur+`<div>Precisa tirar <b class="${need>7?"neg":"pos"}">${fn(ce(need))}</b> em cada um dos ${rest} bimestre(s) que faltam (${left}).</div>`};
}
